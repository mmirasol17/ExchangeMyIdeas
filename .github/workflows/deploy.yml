name: Deploy to InfinityFree

# Deploys the site to InfinityFree over FTP on every push to main.
# Credentials are stored as repository secrets (Settings -> Secrets and
# variables -> Actions): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # InfinityFree serves the site from the htdocs directory
          server-dir: htdocs/
          # Never touch server-only or repo-only files. In particular
          # config.local.php holds the DB credentials and lives ONLY on the
          # server -- excluding it means deploys never overwrite or delete it.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config.local.php
            **/config.local.php.example
            **/README.md
            **/LICENSE
            **/sql.txt
            **/seed.sql
            **/dbtest.php
            **/.DS_Store
