name: Provision server config

# One-shot, manually-triggered job that writes config.local.php from repo
# secrets and uploads it over FTP, then removes the temporary dbtest.php.
#
# config.local.php lives only on the server (it is gitignored and excluded
# from the normal deploy), so this is how it gets there without a hand upload.
# Run from the Actions tab -> "Provision server config" -> Run workflow.

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Generate config.local.php from secrets
        run: |
          cat > config.local.php <<PHP
          <?php
          // Generated by the provision workflow -- do not commit.
          \$dbHost = '${{ secrets.DB_HOST }}';
          \$dbName = '${{ secrets.DB_NAME }}';
          \$dbUser = '${{ secrets.DB_USER }}';
          \$dbPass = '${{ secrets.DB_PASS }}';
          \$migrateKey = '${{ secrets.MIGRATE_KEY }}';
          \$adsenseClient = '';
          \$adsenseSlot = '';
          PHP

      - name: Upload config.local.php and remove dbtest.php
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}" <<'LFTP'
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 3
          set net:timeout 25
          put -O /htdocs config.local.php
          rm -f /htdocs/dbtest.php
          bye
          LFTP
          echo "Provisioning complete."
